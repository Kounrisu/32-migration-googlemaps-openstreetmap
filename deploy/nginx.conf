server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers. Tighten connect-src/img-src to 'self' once tiles and geocoding are proxied
  # on this origin (docs/05). With direct calls, list the tile host and geocoder host explicitly.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://api-adresse.data.gouv.fr; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(self)" always;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Runtime config and the shell must never be cached: they change per environment / release.
  location = /config.json { add_header Cache-Control "no-store"; }
  location = /index.html  { add_header Cache-Control "no-store"; }

  # Hashed build assets: immutable.
  location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Optional same-origin proxies (uncomment and point at the real services):
  # location /tiles/ {
  #   proxy_pass https://tiles.internal.example/;
  #   proxy_cache_valid 200 7d;
  # }
  # location /geocode/ {
  #   proxy_pass https://geocoder.internal.example/;
  # }

  location / { try_files $uri /index.html; }
}
